<header class="header">
  <div class="container header-inner">
    <a
      class="brand"
      [attr.aria-label]="i18n.t('navigation.brand')"
      [routerLink]="i18n.path('home')"
    >
      <span class="brand-mark"><tn-icon name="car" /></span>
      <span>Tra<span class="brand-accent">Nhanh</span></span>
    </a>
    <nav
      class="desktop-nav"
      [attr.aria-label]="i18n.t('navigation.main')"
    >
      <a
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        [routerLink]="i18n.path('home')"
        >{{ i18n.t('navigation.home') }}</a
      >
      <a
        routerLinkActive="active"
        [routerLink]="vehiclePath(i18n.locale())"
        >{{ i18n.t('navigation.vehiclePlate') }}</a
      >
    </nav>
    <div class="header-actions">
      <tn-language-switcher
        class="desktop-language"
        controlId="language-desktop"
        [compact]="true"
      />
      <label
        class="sr-only"
        for="theme-preference"
        >{{ i18n.t('theme.label') }}</label
      >
      <select
        class="theme-select"
        id="theme-preference"
        [value]="theme.preference()"
        (change)="changeTheme($event)"
      >
        <option value="system">{{ i18n.t('theme.system') }}</option>
        <option value="light">{{ i18n.t('theme.light') }}</option>
        <option value="dark">{{ i18n.t('theme.dark') }}</option>
      </select>
      <button
        #toggle
        aria-controls="mobile-navigation"
        class="menu-toggle"
        size="icon"
        tnButton
        type="button"
        variant="ghost"
        [attr.aria-label]="i18n.t(menuOpen() ? 'navigation.closeMenu' : 'navigation.openMenu')"
        [attr.aria-expanded]="menuOpen()"
        (click)="toggleMenu()"
      >
        <tn-icon [name]="menuOpen() ? 'close' : 'menu'" />
      </button>
    </div>
  </div>
  <nav
    class="mobile-nav container"
    id="mobile-navigation"
    [attr.aria-label]="i18n.t('navigation.mobile')"
    [hidden]="!menuOpen()"
  >
    <a
      [routerLink]="i18n.path('home')"
      (click)="closeMenu()"
      >{{ i18n.t('navigation.home') }}</a
    >
    <a
      [routerLink]="vehiclePath(i18n.locale())"
      (click)="closeMenu()"
      >{{ i18n.t('navigation.vehiclePlate') }}</a
    >
    <tn-language-switcher controlId="language-mobile" />
  </nav>
</header>
